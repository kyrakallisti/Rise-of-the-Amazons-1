#Norsellenic Aspidoklastai
  a_aspidoklastai_1: "Aspidoklastai"
  a_aspidoklastai_1_desc: "Born from the mingling of Norse-Amazon conquerors and Hellenic-Amazon traditionalists, the Aspidoklastai embody the martial traditions of both peoples. Clad in heavy mail forged by the smiths of Metria Khora and armed with sturdy shields and fearsome axes, they were created to shatter phalanxes and bring down heavily armored Kataphractoi. Though their ancestors arrived as invaders, the Aspidoklastai now stand as loyal defenders of the realm, combining Norse ferocity with Hellenic discipline."
  
  a_aspidoklastai_2: "Hearthguard Aspidoklastai"
  a_aspidoklastai_2_desc: "The descendants of the Norse-Amazon settlers no longer see themselves as foreign conquerors. Their villages, farms, and strongholds now dot the coasts of Metria Khora and the defense of these lands has become a matter of honor and duty. Armed with heavy axes and sturdy shields, the Hearthguard Aspidoklastai fight with the determination of warriors defending their homes, their families, and their place within the realm."

  a_aspidoklastai_3: "Heavy Aspidoklastai"
  a_aspidoklastai_3_desc: "As armor grows stronger and shields gradually disappear from the battlefield, the Aspidoklastai have adapted their methods accordingly. Forgoing shields in favor of heavier armor and massive two-handed poleaxes, they have become fearsome shock troops capable of smashing through plate armor and shattering enemy morale. Few warriors can withstand the force of a Heavy Aspidoklastai charge, and fewer still remain standing after the first blow lands."
 
  a_aspidoklastai_4: "Chosen Aspidoklastai"
  a_aspidoklastai_4_desc: "The rise of pike formations and gunpowder warfare has done little to diminish the battlefield value of the Aspidoklastai. Generations of combat experience have transformed them into elite assault troops, entrusted with the most difficult and dangerous tasks. Whether breaking enemy formations, storming fortifications or exploiting breaches in the line, the Chosen Aspidoklastai remain feared for their relentless aggression and unmatched skill with the axe."

  a_aspidoklastai_5: "Grenadier Aspidoklastai"
  a_aspidoklastai_5_desc: "Always quick to embrace any weapon capable of breaking enemy defenses, the Aspidoklastai readily adopted grenades as instruments of war. Selected from the strongest and most experienced warriors, these elite assault troops hurl explosive charges into enemy ranks before advancing with axe and pistol to finish the work. Their mastery of shock tactics has made the Grenadier Aspidoklastai a terrifying sight for fort defenders and field armies alike."
 
  a_aspidoklastai_6: "Imperial Aspidoklastai"
  a_aspidoklastai_6_desc: "Once the warriors of Norse-Amazon conquerors, the Aspidoklastai have become one of the most celebrated military institutions of the Amazon Empire. Drawn from the finest warriors of the Norsellenic provinces and equipped with the best arms the Empire can provide, they serve as elite assault troops capable of breaking even the strongest enemy positions. Armed with grenades, pistols, and their iconic axes, the Imperial Aspidoklastai embody centuries of martial evolution, combining the ferocity of their Norse ancestors with the discipline and loyalty expected of the Basilissa's finest soldiers."

