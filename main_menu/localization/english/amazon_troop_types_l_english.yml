#Artemisian Lykotoxotai
  a_lykotoxotai_1: "Lykotoxotai"
  a_lykotoxotai_1_desc: "The Lykotoxotai are the famed Wolf Archers of Artemisia, raised among the vast northern forests and devoted to Artemis, Goddess of the Hunt. Skilled trackers, hunters and woodswomen from an early age, they wield powerful recurved bows with deadly precision while moving unseen through terrain that would hinder ordinary soldiers. Clad in wolf pelts and bearing the traditions of their frontier homeland, the Lykotoxotai excel at ambushes, skirmishes and relentless harassment, striking from the shadows before vanishing back into the wilderness."
  
  a_lykotoxotai_2: "Veteran Lykotoxotai"
  a_lykotoxotai_2_desc: "For generations, the divided lands of Artemisia have been shaped by constant frontier warfare. Norse settlers occupy portions of the western coast, while raids, skirmishes and territorial disputes continue to plague the shores. The Lykotoxotai who so often rise to defend their homes emerge as seasoned warriors, their skills honed through years of stalking enemies across forests and mountains alike. Patient, disciplined and deadly, the Veteran Lykotoxotai embody the hard-earned experience of a people who have never known true peace."
  
  a_lykotoxotai_3: "Huntmaster Lykotoxotai"
  a_lykotoxotai_3_desc: "The shores of Artemisia have bled enough from endless invasions. The Lykotoxotai no longer limit themselves to defending their forests. Clad in finer armor and wielding powerful composite war bows, these master huntresses now carry the war into enemy lands, serving as scouts, raiders and sharpshooters for the armies of Artemisia. Their enemies soon learn that the wolves of the north have taken to the seas. The hunted are about to become the hunters."
  
  a_lykotoxotai_4: "Chosen Lykotoxotai"
  a_lykotoxotai_4_desc: "The spread of gunpowder has transformed warfare across the world, yet the Lykotoxotai remain unmatched in the forests, mountains and wilderness of the north. Drawn from the most accomplished huntresses of Artemisia, these chosen warriors combine generations of woodland expertise with exceptional skill at archery, reconnaissance and irregular warfare. While armies clash in ordered formations, the Chosen Lykotoxotai strike unseen, gathering intelligence, harassing supply lines and hunting down vulnerable foes far beyond the battlefield."
  
  a_lykotoxotai_5: "Wolfguard Lykotoxotai"
  a_lykotoxotai_5_desc: "The Wolfguard Lykotoxotai represent the pinnacle of Artemisia's ancient hunting traditions. Armed with finely crafted rifles capable of striking targets far beyond the reach of ordinary smoothbore muskets, they serve as reconnaissance, markswomen and ambushers for the armies of the north. Yet despite embracing new weapons, they remain faithful to the teachings of Artemis, retaining the stealth, patience and fieldcraft that made their predecessors legendary. Whether stalking enemy officers through dense forests, screening advancing armies or harassing retreating foes, the Wolfguard Lykotoxotai are feared throughout Amazonesia as relentless hunters who strike with deadly precision before vanishing into the wild once more."
  
  a_lykotoxotai_6: "Imperial Lykotoxotai"
  a_lykotoxotai_6_desc: "Centuries of warfare, exploration and frontier service have transformed the Lykotoxotai into one of the most respected military institutions in Amazonesia. Armed with superb rifles and renowned for their unmatched fieldcraft, they serve as scouts, pathfinders and sharpshooters wherever the Amazon Empire's armies march. Though their equipment has changed with the times, the spirit of the hunt endures. To become an Imperial Lykotoxotēs is to join a lineage stretching back to the wolf-clad huntresses who once defended the forests of Artemisia alone against foreign invaders."

