#Heraian Kataphraktoi
  a_kataphractoi_1: "Heraian Kataphractoi"
  a_kataphractoi_1_desc: "The Heraian Kataphractoi are drawn from the oldest and most prestigious noble dynasties of Metria Khora. Raised from birth to ride and wage war, they enter battle clad in the finest armor and mounted upon magnificent warhorses. Armed with long two-handed kontoi, these amazons strike with overwhelming force, breaking enemy lines in a storm of steel, discipline, and thunderous hooves."

  a_kataphractoi_2: "Resurgent Kataphractoi"
  a_kataphractoi_2_desc: "The scars left by the Norse-Amazon invasions have not yet fully faded, yet the noble houses of Metria Khora have rebuilt their fortunes and restored their martial traditions. Better equipped, better mounted, and more numerous than in generations past, the Resurgent Kataphractoi embody the determination of a people reclaiming their rightful place among the great powers of the world."

  a_kataphractoi_3: "Heavy Kataphractoi"
  a_kataphractoi_3_desc: "With the noble houses of Metria Khora restored to prosperity and power, the Kataphractoi have reached the pinnacle of their traditional form. Encased in magnificent suits of full plate armor and mounted upon carefully bred warhorses, these warriors represent the zenith of heavy cavalry warfare. Few formations can stop the impact of a Heavy Kataphract charge, and fewer still can survive it."

  a_kataphractoi_4: "Guardian Kataphractoi"
  a_kataphractoi_4_desc: "The spread of gunpowder has challenged the supremacy of heavy cavalry, yet the Kataphractoi remain among the most formidable warriors on any battlefield. Encased in masterfully crafted plate armor and mounted upon powerful destriers, they can shrug off most blades and even distant musket fire. Though no longer invulnerable, the Kataphractoi continue to dominate the field through superior training, discipline, and the overwhelming force of their charges."

  a_kataphractoi_5: "Reformed Kataphractoi"
  a_kataphractoi_5_desc: "The growing lethality of firearms has forced even the proud Kataphractoi to adapt. Abandoning the cumbersome armor that once encased both rider and steed, they now concentrate their protection upon the most vital areas while retaining their iconic steel masks and reinforced cuirasses. Faster, more agile, yet no less disciplined than their predecessors, the Reformed Kataphractoi continue to deliver devastating lance charges while exploiting speed and maneuver to strike where the enemy is weakest."

  a_kataphractoi_6: "Imperial Kataphractoi"
  a_kataphractoi_6_desc: "The Imperial Kataphractoi represent the culmination of centuries of Heraian heavy cavalry tradition. Though still drawn from the noble dynasties of Metria Khora, their loyalty now belongs first and foremost to the Basilissa and the Amazon Empire. Equipped with the finest arms and armor that modern industry can provide, these elite horsewomen combine the discipline of professional soldiers with the martial heritage of their ancestors. Wherever the Imperial Kataphractoi ride, the authority of the Crown follows in their wake."

