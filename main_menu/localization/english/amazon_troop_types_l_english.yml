#Thalassan Polyremes
  n_polyreme_1: "Diērēs"
  n_polyreme_1_desc: "The Diērēs is the foundation of the Thalassan naval tradition. Swift, agile and perfectly suited to the narrow seas and island-strewn waters of Amazonothéia, these war galleys are crewed by disciplined sailors and marines drawn from their wealthy maritime city-states. Though modest in size, they embody the seamanship and determination that have long protected Thalassan commerce and independence."

  n_polyreme_2: "Triērēs"
  n_polyreme_2_desc: "Building upon centuries of naval experience, the Triērēs combines greater endurance and fighting power with the speed and maneuverability for which Thalassan vessels are renowned. Their crews train relentlessly in navigation, boarding actions and coordinated fleet maneuvers, ensuring Thalassan dominance throughout the archipelagos and coastal waters of Amazonothéia."

  n_polyreme_3: "Tetrērēs"
  n_polyreme_3_desc: "The Tetrērēs represents the maturation of the Thalassan art of war at sea. Larger and more heavily armed than its predecessors, it nenetheless retains the agility required to navigate straits, reefs and narrow channels. Under experienced captains, squadrons of Tetrērēis serve as the mailed fist of the Thalassan fleets, protecting trade routes and carrying the League's influence across distant waters."

  n_polyreme_4: "Hexērēs"
  n_polyreme_4_desc: "The Hexērēs is the pinnacle of classical galley warfare. Designed to project power far beyond the traditional waters of the Thalassan city-states, these formidable warships carry larger complements of marines and increasingly sophisticated naval armaments. Yet despite their size, they remain swift enough to exploit the shallow waters and confined seas where heavier vessels dare not venture."

  n_polyreme_5: "Oktērēs"
  n_polyreme_5_desc: "The Oktērēs stands at the crossroads between tradition and innovation. Built during an era of rapid naval advancement, these imposing polyremes combine the proven strengths of the ancient Thalassan galley with increasingly sophisticated artillery and reinforced construction. Though larger and more heavily armed than any previous generation, they remain remarkably agile in the shallow seas, straits and archipelagos of Amazonothéia. Serving as both warships and instruments of power projection, the Oktērēs allows the Thalassan city-states to preserve their naval supremacy even as the character of warfare upon the seas begins to change."

  n_polyreme_6: "Thalassophylax Dekērēs"
  n_polyreme_6_desc: "Named for the Guardians of Thalassa, the Thalassophylax Dekērēs represents the culmination of centuries of maritime innovation. Revered throughout Amazonesia, these magnificent vessels serve as the backbone of the Thalassan fleets, combining unmatched seamanship, disciplined marine contingents and powerful naval artillery. Though the age of great sailing warships dawns upon the world, the Thalassophylax remains a symbol of Thalassan mastery over the seas blessed by the Goddess Thalassa herself."

