#Saebornar Longships
  n_longship_1: "Snekkja" #Sea Snake
  n_longship_1_desc: "The Snekkja is the vessel upon which the fortunes of the Saebornar were built. Descended from the ancient longships that first crossed the cold waters between the Old World and Sverðfiskeyjar, these swift seacrafts are unmatched in speed and maneuverability. Though lightly armed and fragile in battle, their skilled crews navigate treacherous seas with confidence born of generations spent beneath the gaze of Rán, Goddess of the Sea."

  n_longship_2: "Skeið" #Slider or Cutter
  n_longship_2_desc: "As commerce and exploration expand across the North Atlantic, the Skeið reflects the growing sophistication of Saebornar shipwrights. Larger and more seaworthy than the traditional Snekkja, it combines the agility of its predecessors with improvements inspired by foreign shipbuilding traditions from South Amazonesia. Merchant captains, explorers and naval patrols alike rely upon these versatile vessels to maintain the sea-lanes that bind Norðrheimar and the Vinland colonies together."

  n_longship_3: "Dreki" #Dragon
  n_longship_3_desc: "The Dreki marks the transition from coastal longship to true ocean-going vessel. Built for lengthy voyages across the northern seas, it carries larger crews, greater provisions and increasingly powerful armaments. By this age, the routes first pioneered by the Saebornar have become well-traveled highways of trade and migration, and the Drakkar serves as their trusted guardian."

  n_longship_4: "Ránarvörðr" #Guardian of Rán
  n_longship_4_desc: "Named for the Guardians of Rán, the Ránarvörðr represents the maturity of the Saebornar naval tradition. Fast, resilient and expertly handled, these vessels excel at escorting merchant convoys, hunting enemy commerce and projecting power across distant seas. Their crews regard themselves not merely as sailors, but as inheritors of a sacred maritime legacy stretching back to the first overseas colonies of Norðrheimar."

  n_longship_5: "Haffrigata" #Sea Frigate
  n_longship_5_desc: "The Haffrigata embodies centuries of accumulated maritime knowledge. Though modern naval warfare increasingly favors larger and more heavily armed vessels, the captains of the Haffrigata continue to rely upon superior speed, maneuverability and seamanship to dictate the terms of battle. Feared by pirates and respected by admirals, these swift warships patrol vast stretches of ocean with remarkable efficiency."

  n_longship_6: "Hafdrottning" #Queen of the Sea
  n_longship_6_desc: "The Hafdrottning stands as the culmination of Norðrheimar Atlantic seamanship. Combining advanced naval technology with the enduring principles established by the earliest Saebornar navigators, these formidable ships are renowned for their speed, discipline and uncanny ability to evade destruction. Whether scouting distant horizons, protecting vital trade routes or pursuing enemy fleets across entire oceans, the Nordhafsjäger remains a symbol of the mastery of the Sea-Born over the waters of the world."

