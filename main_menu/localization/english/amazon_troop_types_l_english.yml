#Arnarvaengir Arnarskyttarar
  a_arnarskyttarar_1: "Arnarskyttarar"
  a_arnarskyttarar_1_desc: "The Arnarskyttarar are the famous 'Eagle Shooters' of Arnareyar, raised among towering cliffs and windswept coasts where keen eyesight and steady hands are prized above all else. From an early age they learn to judge distance, read the wind and loose their arrows with remarkable precision. Wielding powerful longbows crafted from the finest timber of the northern forests, these disciplined markswomen strike with deadly accuracy long before their enemies can close the distance."

  a_arnarskyttarar_2: "Keen Arnarskyttarar"
  a_arnarskyttarar_2_desc: "Years of relentless practice and frontier warfare have refined the eyesight and judgment of the Keen Arnarskyttarar to extraordinary levels. Few warriors can rival their ability to estimate range, account for shifting winds or strike vulnerable targets amidst the chaos of battle. Enemy officers and standard bearers quickly learn that nowhere within bowshot is truly safe from the gaze of the Eagles."

  a_arnarskyttarar_3: "Elite Arnarskyttarar"
  a_arnarskyttarar_3_desc: "Only the most accomplished archers among the Arnarvængir earn the honor of joining the Elite Arnarskyttarar. Equipped with finely crafted war bows and superior equipment, they represent the pinnacle of traditional Amazon archery. Their disciplined volleys and uncanny precision allow them to inflict devastating casualties while sowing fear and disorder among enemy formations."

  a_arnarskyttarar_4: "Eagleguard Arnarskyttarar"
  a_arnarskyttarar_4_desc: "As firearms spread across Amazonesia, the Eagleguard Arnarskyttarar preserve centuries of accumulated mastery while adapting their methods to an ever-changing battlefield. Entrusted with protecting the finest traditions of Arnarvængir marksmanship, they continue to demonstrate that discipline, patience and precision remain as valuable as ever, even in an age increasingly dominated by gunpowder."

  a_arnarskyttarar_5: "Longshot Arnarskyttarar"
  a_arnarskyttarar_5_desc: "Embracing finely crafted rifles while preserving the principles that made their predecessors legendary, the Longshot Arnarskyttarar have become the foremost markswomen of Amazonesia. Their exceptional training allows them to eliminate officers, artillery crews and other valuable targets at distances that ordinary soldiers would scarcely attempt. Every shot is deliberate, every bullet carefully placed and every miss considered a personal failure."

  a_arnarskyttarar_6: "Imperial Arnarskyttarar"
  a_arnarskyttarar_6_desc: "The Imperial Arnarskyttarar embody the culmination of centuries of Arnarvængir marksmanship. Armed with the finest precision rifles produced by the Empire and selected from the greatest shooting traditions of their homeland, they became the greatest nightmare of enemy armies marching on open fields. Their reputation is such that enemy commanders learn to fear not the sound of their rifles, but the silent moments before a perfectly aimed shot finds its mark."

