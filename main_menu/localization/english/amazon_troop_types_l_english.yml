#Salacian Unique Units
  a_legionariae_1: "Salacian Legionaries"
  a_legionariae_1_desc: "While the rest of Rome fragmented beneath the weight of invasion and decline, the Salacian Amazons remained united and steadfast in their devotion to Roman civilization. The Legio XII Salaciana, once garrisoned in Salacia, survived the fall of its parent Empire and was reborn as an Amazon legion. Preserved within the sacred Campi Bellonae, its traditions have endured for centuries, altered only where necessity demanded. Every Salacian Legionary marches as the heir to an unbroken martial lineage stretching back to the glory days of Rome."

  a_legionariae_2: "Restored Legionaries"
  a_legionariae_2_desc: "As the nations of the world embrace the Renaissance and rediscover the wisdom of antiquity, the Salacian Legions likewise look to their own past. Long-forgotten innovations such as the Lorica Segmentata, the Pilum and the Acies Triplex are restored to service. Once abandoned as overly complex and costly to maintain, these advances can now be sustained through improved metallurgy, administration, and logistics. By reviving the methods that once made the Roman armies the finest of their age, the Salacians restore the Legion to its former glory."

  a_legionariae_3: "Expeditionary Legionaries"
  a_legionariae_3_desc: "The Age of Discovery has carried Salacian banners far beyond their home shores. To serve the Senate's growing network of colonies and overseas possessions, the Legions have adapted to long campaigns, distant deployments, and unfamiliar foes. Supported by advanced logistics and powerful fleets, these Expeditionary Legionaries bring Roman order and Bellonan discipline to even the most distant frontiers of Salacian civilization."

  a_legionariae_4: "Integrated Legionaries"
  a_legionariae_4_desc: "The spread of gunpowder warfare has transformed the battlefield. While many armies abandoned their traditional methods entirely, the Salacian Legions instead adapted them. Arquebusiers now fight beside pikewomen and swordswomen in disciplined formations, combining the proven virtues of Roman organization with the destructive power of firearms. Though the Pilum has passed into history, the Legion remains as formidable as ever."

  a_legionariae_5: "Reformed Legionaries"
  a_legionariae_5_desc: "Centuries of warfare have taught the Salacian Legions a difficult lesson, tradition alone cannot win tomorrow's battles. The Scutum, the pike, and even the venerable Lorica Segmentata have finally yielded to the realities of modern warfare. Armed with muskets and drilled to deliver devastating volleys, Reformed Legionaries fight in disciplined ranks while retaining the unshakable resolve that has defined the Legion since the days of ancient Rome. Though their appearance has changed, their spirit remains the same."

  a_legionariae_6: "Imperial Legionaries"
  a_legionariae_6_desc: "After centuries of adaptation and reform, the Salacian Legion has reached the pinnacle of military excellence. Though little remains of the equipment carried by the ancient Legio XII Salaciana, its spirit endures unchanged. Armed with the finest weapons that modern industry can provide and drilled to a standard unmatched anywhere in the world, Imperial Legionaries serve as the embodiment of Salacia's Imperium: disciplined, professional, and victorious. They are living proof that while Rome itself may have fallen, Salacia never did."

