#Athenaian Hoplitai
  a_hoplitai_1: "Hoplitai"
  a_hoplitai_1_desc: "The Hoplitai form the backbone of the armies from the fragmented and democratic city-states of Athēnéia. Drawn from the free citizenry and trained from an early age in the arts of warfare and civic duty, they fight in disciplined phalanxes with spear and shield, standing firm where lesser troops might falter. Though neither professional soldiers nor aristocratic warriors, their courage, education and devotion to their Polis make them among the most reliable levied infantry in Amazonesia."
  
  a_hoplitai_2: "Veteran Hoplitai"
  a_hoplitai_2_desc: "Generations of rivalry, alliance and warfare among the city-states of Athēnéia have forged the Hoplitai into seasoned defenders of their respective Poleis. Though still drawn from the citizenry rather than a professional warrior class, these experienced soldiers possess a deep understanding of formation warfare and civic responsibility. Their steadfast discipline and determination allow them to stand firm against enemies that would scatter lesser militias."
  
  a_hoplitai_3: "Phalangitai"
  a_hoplitai_3_desc: "As the city-states of Athēnéia grew wealthier and more ambitious, their military traditions evolved beyond the limitations of the old hoplite phalanx. Armed with a massively long pike and protected by improved armor, the Phalangitai fight in dense formations capable of presenting a forest of spearpoints to any foe. Though their tactics have changed, they remain citizen-soldiers at heart, combining civic duty with battlefield discipline to form some of the most dependable infantry in Amazonesia."
  
  a_hoplitai_4: "Sarissa Phalangitai"
  a_hoplitai_4_desc: "The military reforms of Athēnéia have transformed the ancient phalanx into a formidable force suited to a changing age. Armed with improved Sarissa pikes and increasingly supported by early firearms, the Phalangitai continue to draw their strength not from professional warrior castes, but from the dedication of the Polis itself. Every woman who takes her place within the formation stands not merely as a soldier, but as a citizen fulfilling her duty to her community."
  
  a_hoplitai_5: "Politophylakes"
  a_hoplitai_5_desc: "The ancient pike formations of Athēnéia have finally given way to the age of powder and shot. Organized into disciplined firing lines and trained extensively in the use of muskets, the Politophylakes continue the long tradition of citizen service upon which the city-states were founded. Though no longer fighting as phalangites, they remain steadfast defenders of their communities, combining civic responsibility with martial discipline to remain one of the most dependable militia forces in Amazonesia."
  
  a_hoplitai_6: "National Guard"
  a_hoplitai_6_desc: "The National Guard represents the culmination of centuries of civic and military tradition. Drawn from an educated citizenry and trained to high standards of discipline, these conscripted soldiers stand ready to defend the liberties, institutions and communities of Athēnéia and beyond. Though armed and equipped according to the demands of modern warfare, they remain heirs to the ancient Hoplitai who once marched from the Poleis with spear and shield. In their ranks, the bond between citizenship and military service endures stronger than ever."

  unlock_hoplitai_1_advance: "$a_hoplitai_1$"
