l_english:

# A Blessing from the All-Mother
 flavor_amz.1.title: "A Blessing from the All-Mother"
 flavor_amz.1.desc: "Despite her advanced age, [mother_owl.GetName] has been blessed by the All-Mother and is now expecting a royal child. A legitimate heir who, unlike her firstborn [bastard_owl.GetName], shall be born with pure and unquestioned noble blood. This is welcome news among the wealthy coastal [ShowCultureName('norsellenic_amazon')] provinces, as the Basilíssa's consort hails from a powerful lineage from [GetCountry('ANEA').GetName]. Yet [bastard_owl.GetName] has long been groomed to rule. The steadfast [ShowCultureName('heraean_amazon')] provinces of the Inner Valleys would sooner see a bastard crowned than a child with 'northern barbarian blood' upon the throne. Shall we embrace this unexpected blessing and allow a new heir to rise? Or shall we finally legitimize the capable and deserving [bastard_owl.GetName], preserving the current order?"
 flavor_amz.1.historical_info: "For decades, the lack of a legitimate heir has haunted the rule of [mother_owl.GetName]. Her firstborn was the result of a love affair with a lowborn palace guard, a scandal that shook the foundations of the dynasty. Since her ascension, Althaía has sought tirelessly to conceive a proper heir with noble suitors of pure [ShowCultureName('heraean_amazon')] descent, yet all efforts failed. In a twist of fate, it was only her latest consort, one of mixed Norse blood, who succeeded where all others did not. Some interpret this as a sign from the All-Mother herself, heralding the rise of a new, unified Amazon identity through [ShowCultureName('norsellenic_amazon')] culture. Others whisper that it is nothing more than a cruel jest by Eris, sowing discord at the heart of the Basiléia."
 flavor_amz.1.a: "This child is a gift from the All-Mother. A new future dawns!"
 flavor_amz.1.a.tt: "[bastard_owl.GetName] will have to accept the status quo. It's for the greater good of the Amazon Basiléia that her unborn sister shall become heir."
 flavor_amz.1.b: "Legitimize [bastard_owl.GetNameWithNoTooltip]!"
 flavor_amz.1.b.tt: "Bastard or not, [bastard_owl.GetName] has the Blood of Hippolyta within her veins, and pure [ShowCultureName('heraean_amazon')] heritage. She is a proven warrior and a capable leader. She deserves the crown!"

# The Last Breath of the Basilíssa"
 flavor_amz.2.title: "The Last Breath of the Basilíssa"
 flavor_amz.2.desc: "What should have been a moment of great joy has turned into a moment of grief and mourning. Complications took hold as [mother_owl.GetName] struggled through the birth of her secondborn. Her strength faltering under the weight of her advanced age and frail condition. The midwives fought desperately to save both mother and child. Although the babe was delivered alive (small, fragile, yet breathing), the Basilíssa was too weak to recover. In her final moments, she asked for her firstborn. With fading voice and trembling hands, she named the child Elpís and made one last plea: that her daughters would stand together, no matter blood or birth."
 flavor_amz.2.historical_info: "Even before the late Basilíssa's body grows cold, the realm begins to stir. In the heartlands of the [ShowCultureName('heraean_amazon')], priestesses and nobles whisper of duty, [ShowCultureGroupName('hellenic_amazon_group')] purity, and preservation. They rally behind [bastard_owl.GetName], placing their faith and their armies at the Firstborn Princess' disposal. Yet in the cradle lies another future. Frail, silent… but undeniable. The throne of the Amazons shall not remain empty for long. For the country demands to see the rise of a new Basilíssa."
 flavor_amz.2.a: "Crown Agathe, rightful and recognized!"
 flavor_amz.2.a.tt: "[bastard_owl.GetName] has been legitimized, prepared, and already embraced by the heartlands. She shall rightfully and dutifully ascend as the new Basilíssa, raising her newborn sister within the palace as her own heir, until the All-Mother grants her a daughter of her own."
 flavor_amz.2.b: "Honor Althaía's last wish"
 flavor_amz.2.b.tt: "Grief must not fracture the realm. Though the throne slips from her grasp, [bastard_owl.GetName] will not betray her mother's final plea. She shall stand as Regent and Guardian to her newborn sister, even though without any backing or legitimacy of her own it'll be very hard to keep the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] in line."
 flavor_amz.2.c: "The crown cannot wait for a cradle"
 flavor_amz.2.c.tt: "The Basiléia stands at the edge of chaos. A fragile newborn cannot rule, and the realm demands strength now. Backed by the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] and the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] of the heartlands, [bastard_owl.GetName] claims the throne by will and necessity! No matter the consequences."
 flavor_amz.2.d: "There is only one way to secure the throne for good."
 flavor_amz.2.d.tt: "Hope is a dangerous thing. As long as the child draws breath, whispers will grow into armies, and armies into war. A quiet end now could spare the realm years of bloodshed. But some lines, once crossed, can never be undone."
 flavor_amz.2.d.random1: "Fragile as she is due to the her premature birth, the child might simply 'not survive' the day"
 flavor_amz.2.d.random2: "[aunt_owl.GetName] uncovers the plot and draws her sword, rallying half of the Basilíssēs Phýlakes to protect [baby_owl.GetName]. Securing the throne comes at a terrible cost for [bastard_owl.GetName], as not one but two members of the [mother_owl.GetDynasty.GetNameWithNoTooltip] lie dead. There is no hiding such bloodshed now."
 flavor_amz.2.d.random3: "[aunt_owl.GetName] uncovers the plot and draws her sword, rallying half of the Basilíssēs Phýlakes to protect [baby_owl.GetName]. A brutal battle erupts within the Royal Palace, yet amid the chaos she manages to slip away with the babe, fleeing [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] toward [GetCountry('ANEA').GetName]."
 flavor_amz.2.e: "A new heir is born to the Basiléia"
 flavor_amz.2.e.tt: "With the passing of [mother_owl.GetName], the realm turns its gaze to the fragile newborn she leaves behind. There are no rivals left within the palace, no competing claims strong enough to challenge the child's right. Elpís, born in grief, now carries the full weight of the Basiléia's future alone."

# A Child in Exile
 flavor_amz.3.title: "A Child in Exile"
 flavor_amz.3.desc: "In what seemed to be an ordinary morning, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] is suddenly rushed by her guards toward the Western Gates of [ROOT.GetCountry.GetCapital.GetName], where a dozen Basilíssēs Phýlakes arrive from [GetCountry('ABAS').GetName] atop exhausted horses. Their capes stained in blood. Some are wounded, barely holding to their reins. Ahead of them, [aunt_owl.GetName] carefully dismounts, bearing a fragile child wrapped in royal silk. The premature newborn is none other than [baby_owl.GetName], legitimate daughter of [mother_owl.GetName]. The rightful heir to [GetCountry('ABAS').GetName]. Yet to shelter her is to defy a crowned ruler. To reveal her is to invite war. And to return her… is to abandon destiny itself."
 flavor_amz.3.historical_info: "The tale [aunt_owl.GetName] brings is one of grief, betrayal, and steel. The pregnant [mother_owl.GetName] has perished in childbirth, the baby barely made it. Her last wish was for her daughters to stand together, but it was too much to ask. [bastard_owl.GetName] seized the throne for herself, backed by the Endon Koilai nobility. Fearing for the newborn's life, loyalists within the palace acted swiftly. As the usurper crowned herself, chaos engulfed the court. The Basilíssēs Phýlakes split, blades were drawn, and the child was nearly lost to treachery. Yet against all odds, she lives, and now rests safely within our mighty walls. Already, the warriors and shieldmaidens of [ROOT.GetCountry.GetName] whisper the babe's name with reverence. Some kneel. Others call for war. For is she not the future? The blood of Hippolyta… mingled with the blood of Svana the Bold. The first [ShowCultureName('norsellenic_amazon')] Basilíssa — and the herald of a new era."
 flavor_amz.3.a: "We will protect the child. Let the Usurper come!"
 flavor_amz.3.a.tt: "Refuse all demands to surrender [baby_owl.GetName]. If the Usurper seeks her, here she will find only steel!"
 flavor_amz.3.b: "Hide her. Beyond the horizon, beyond their reach!"
 flavor_amz.3.b.tt: "Allow the Usurper to search our lands in vain while [baby_owl.GetName] is secretly sent away aboard our fastest vessel. For years we shall prepare. Forging alliances, strengthening our realm and waiting for the day she comes of age. When that day arrives, we'll welcome [baby_owl.GetName] back with an army ready and eager to take back what is rightfully hers!"

# The Return of the Queen
 flavor_amz.4.title: "The Return of the Queen"
 flavor_amz.4.land.desc: "For sixteen years, she has known only war. Raised beneath banners and blades, [baby_owl.GetName] grew amidst the clash of armies and the roar of battle. From her earliest days, she was not shielded from the struggle, but forged within it. The child once carried in desperate flight now stands as a warrior shaped by fire and steel. Hardened by conflict, guided by duty, and watched by those who bled to protect her claim. She is no longer merely a symbol to defend. She is a Basilíssa ready to reclaim what was taken from her."
 flavor_amz.4.land.historical_info: "The years of strife that followed her escape did not break her. It tempered her. While the realm fractured and rival powers vied for dominance, [baby_owl.GetName] was raised among soldiers, commanders, and loyalists who never abandoned her cause. To them, she was never hidden hope, but a living banner beneath which they fought. Now, as word spreads of her coming of age, the realm stands once more at the edge of division. Two daughters of the Hippolytidē now claim the mantle of Basilíssa. One crowned in the capital, the other aclaimed at the realm's largest city. But there can only ever be one true Basilíssa."
 flavor_amz.4.sea.desc: "For sixteen years she was but a whisper carried by the waves. A secret guarded by steel, salt, and silence. Hidden beyond the horizon, far from the reach of usurpers and courts alike, the rightful daughter of [mother_owl.GetName] has lived a life unlike any ruler before her. Raised upon the decks of warships and beneath open skies, [baby_owl.GetName] has known no palace, no courtly intrigue — only the discipline of the oar, the roar of the sea, and the loyalty of those who risked everything to keep her alive. She stands now not as a fragile child of royal blood, but as a hardened leader shaped by wind and wave. The time for hiding is over."
 flavor_amz.4.sea.historical_info: "Word spreads swiftly across the coasts and valleys alike: the lost heir is back! To some, she is Elpís reborn — Hope itself made flesh. To others, she is a pretender raised among foreigners, a threat to the order painstakingly restored after years of turmoil. The realm holds its breath. For now, two daughters of the Hippolytidē stand beneath different skies. One crowned in the capital, the other forged at sea. But there can only ever be one true Basilíssa."
 flavor_amz.4.a: "Raise the banners. The rightful Basilíssa returns!"
 flavor_amz.4.a.tt: "Reveal [baby_owl.GetName] to the world and press her claim. The realm will be divided and war will soon follow. But there can be no peace while an Usurper sits on the throne."

# The Lost Hope
 flavor_amz.5.title: "The Lost Hope"
 flavor_amz.5.desc: "The winds carry no songs this day. [baby_owl.GetName], the child upon whom so many placed their hopes and dreams, has suffered a premature dead. Whether claimed by illness, misfortune, or fate itself, her passing leaves behind only silence where once there was expectation. Those who sheltered her now stand without purpose. Those who feared her rise breathe easier. And the realm, once poised upon the edge of division, finds itself spared a reckoning that now shall never come."
 flavor_amz.5.historical_info: "With the death of [baby_owl.GetName], the final living challenge to the rule of [GetCountry('ABAS').GetName] fades into memory. What might have become a defining struggle for the future of the Amazons instead dissolves into quiet obscurity. Some will remember her as Elpís — Hope — a future that never came to pass. Others will forget her entirely. And history will move on."
 flavor_amz.5.a: "Hope fades… but the realm endures."

# Tretcherous Aunts
 flavor_amz.6.title: "Tretcherous Aunts"
 flavor_amz.6.desc: "The throne is ours! But it wasn't without struggle. Amidst the chaos surrounding [bastard_owl.GetName]'s coronation, a group of treacherous Basilíssēs Phýlakes led by [aunt_owl.GetName] abducted the newborn [baby_owl.GetName] and fled eastward under the cover of confusion. Our loyal Cataphracts pursued them relentlessly, all the way to the walls of [GetCountry('ANEA').GetCapital.GetName], beyond the immediate reach of royal authority. \n\n [GetCountry('ANEA').GetGovernment.GetRuler.GetName], our vassal and aunt of [baby_owl.GetName], has barred our forces from entering the city, impeding any further pursuit. The only way inside the city now is to march our armies upon this Disloyal Subject, storm [GetCountry('ANEA').GetCapital.GetName]'s walls and bring its ruler to heel before she can turn our innocent Elpís into a weapon against us. Yet to do so would plunge the realm into open war. A dangerous beginning to [bastard_owl.GetName]'s rule. There must be… other ways."
 flavor_amz.6.alt.desc: "The throne is ours! But it wasn't without struggle. Amidst the chaos surrounding [bastard_owl.GetName]'s coronation, a group of treacherous Basilíssēs Phýlakes led by [aunt_owl.GetName] abducted the newborn [baby_owl.GetName] and fled eastward under the cover of confusion. Our loyal Cataphracts pursued them relentlessly, all the way to the walls of [GetCountry('ANEA').GetCapital.GetName]. Unlike expected, the city did not bar its gates. Our forces were allowed entry, and the local soldiers loyal to our vassal, [GetCountry('ANEA').GetGovernment.GetRuler.GetName] helped us search every street, every household, every hidden chamber. But the child was not there. \n\n As the city is a busy and important harbour, we do believe the babe has already been smuggled out to sea. Now she is gone, spirited away beyond the horizon. Beyond the reach of armies and authority alike. No siege can reclaim her. No army can search for her across the waves. Only whispers remain. Yet whispers can be chased… if one is willing to descend into shadows. The question is no longer whether we march, but how far we are willing to go to find her."
 flavor_amz.6.a: "Threaten War!"
 flavor_amz.6.a.tt: "The realm must not see weakness in its new ruler. Use this blatant act of insubordination to justify a Casus Belli against our defiant vassal. The looming shadow of war will unsettle the realm, but a display of strength may be enough to remind them who truly rules."
 flavor_amz.6.b: "We will find her… quietly."
 flavor_amz.6.b.tt: "Avoid open war. Dispatch agents, mercenaries, and bounty hunters to track the child in secrecy and return her to us. Safe and sound."
 flavor_amz.6.c: "Focus on stabilizing the realm and securing the throne."
 flavor_amz.6.c.tt: "Let [GetCountry('ANEA').GetGovernment.GetRuler.GetName] keep her niece. We have a fallen Basilíssa to mourn, crisis to contain and a realm to hold together."

# The Queen’s Consecration
flavor_amz.7.title: "The Queen's Consecration"
flavor_amz.7.desc: "The fires of the coronation have long cooled, yet the matter of succession remains unresolved. [bastard_owl.GetName] has successfully legitimized herself with the blessings of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], but she currently sits on the throne alone. Still bound by the sacred vows once sworn to Athena, the Virgin Goddess of Wisdom, she can neither marry nor conceive children. Such devotion befits the zealot warrior she once was… but not a ruler. \n\n At the urging of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] and the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] of the realm, a grand procession is called within the temples of [ROOT.GetCountry.GetCapital.GetName]. Priestesses of great renown gather beneath marble colonnades, bearing garlands, incense and sacred flame. Before them all, [bastard_owl.GetName] is summoned to stand no longer as a maiden of war, but as a Matriarch for all the Amazons. Because a Basilíssa should not stand alone. She must secure the future, through alliance, union and bloodline. As she officially exchanges her religious vows from Athena to Hera, Goddess of Queenship and Motherhood, the Basilíssa stands before gods and mortals alike, ready to choose the one who shall stand beside her and help shape the future of [ROOT.GetCountry.GetName]."
flavor_amz.7.alt.desc: "The reign of [bastard_owl.GetName] stands secure. Thanks to her recent legitimization, her ascension to the throne is unchallenged and her lineage unquestioned. Yet even in peace, the future must be safeguarded. Still devoted to Athena, the Basilíssa has thus far walked the path of the Maiden. A life of discipline, wisdom, and restraint. But a Queen must be more than a symbol of virtue. She must be the foundation of a dynasty. \n\n At the urging of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] and the noble houses, a sacred assembly is convened within the great temples. Incense rises, hymns echo through marble halls, and priestesses gather to bear witness to a transformation not of power, but of purpose. The time has come for the Basilíssa to lay aside the vows of the Maiden, and embrace the mantle of Hera — Goddess of Marriage, Queenship, and Motherhood. Not for desire, but for duty. Today [bastard_owl.GetName] must choose the one who shall stand beside her and help shape the future of [ROOT.GetCountry.GetName]."
flavor_amz.7.a: "[suitor_melinoide.GetName]. A union blessed by the gods themselves."
flavor_amz.7.a.tt: "The ancient and blessed House [suitor_melinoide.GetDynasty.GetNameWithNoTooltip] is the second oldest surviving dynasty among the Amazons, as well as the sacred guardians of the Necropolis at [ShowLocationName('akra_persephones')]. Fabled to be descendants of the Goddess Persephone herself, they have stood strong and defended the Basiléia since times immemorial. Their reputation is impeccable and their legitimacy unquestionable. To wed into their bloodline is as if the Gods themselves are blessing this marriage."
flavor_amz.7.b: "[suitor_leainide.GetName]. Gold, loyalty, and a chance at redemption."
flavor_amz.7.b.tt: "The once proud and powerful House [suitor_leainide.GetDynasty.GetNameWithNoTooltip] was a major house that rivalled the crown itself. A house that fell from grace, losing territory, reputation and influence after remaining loyal to the wrong claimant in a succession war ages ago. Yet, two things keep this house relevant despite their demotion from an Arkhē to a mere Khōra. Their unwavering loyalty, and the deep Gold Mines at [ShowLocationName('thesauroleaines')]. Most of the precious metals used in the royal coinage comes from their mines. Gold that they are willing to offer in great quantity as a dowry for the hand of a Basilíssa in marriage."
flavor_amz.7.c: "[suitor_melanaetide.GetName]. Strength shall secure the throne."
flavor_amz.7.c.tt: "House [suitor_melanaetide.GetDynasty.GetNameWithNoTooltip] currently is the most powerful military house under our rule. The Black Eagle Flag flies over the bravest, fiercest and most disciplined soldiers of the Basiléia. They were the ones who secured the throne for Basilíssa Mégara Hippolytidē three centuries ago. The ones who stopped the Norse Amazon Invasion of [ShowRegionName('motherland_region')] and pushed the Jarls all the way back to the coast. They are the main reason why the entire region isn't speaking Norse and worshiping Frigg right now. And if they were Queenmakers once, they 100% can become Queenmakers again."
flavor_amz.7.d: "[suitor_serikide.GetName]. Let the seas bring new strength."
flavor_amz.7.d.tt: "Why marry a vassal who is already bound to the Basilíssa if instead we could add a bit of foreign help to our roster of allies instead? [GetCountry('ASER').GetName] is a prosperous Oligarchic Polis with a relatively strong navy and strong influence within the Thalassan Octarchy. Their current [GetCountry('ASER').GetGovernment.GetRulerTitle] belongs to House [suitor_serikide.GetDynasty.GetNameWithNoTooltip], a wealthy house that has recently risen from the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]. No legitimacy would be earned from such a marriage, but they can afford a dowry fit for a Basilissa and their connections to the other Thalassan Poleis would be invaluable in improving our relations with fellow [ShowCultureGroupName('hellenic_amazon_group')] from across the mountains and seas."