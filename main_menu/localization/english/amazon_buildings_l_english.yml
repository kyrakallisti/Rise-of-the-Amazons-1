l_english:

  castra_legionis: "Castra Legionis"
  castra_legionis_desc: "A $castra_legionis$ is a permanent military encampment where the professional legionaries of the Republic are recruited, drilled and prepared for war. Inspired by the disciplined organization of the ancient Roman Legions once stationed in Salacia, these fortified camps serve as centers of training, logistics and command, producing the disciplined soldiers whose unwavering cohesion forms the backbone of every Salacian army."
  navalia_magna: "Navalia Magna Salaciae"
  navalia_magna_desc: "A vast circular harbor, carved and shaped by design rather than nature. Within its sheltered waters, fleets gather like a coiled serpent, ready to strike across the sea. Here, Salacia's dominion is not prayed for, but built and sustained by the best shipwrights, carpenters and sailors the Salacianae can muster. While others worship the sea, Salacia Augusta masters it in their Sea Goddess' name."

  hipparcheion: "Hipparcheion"
  hipparcheion_desc: "A $hipparcheion$ is a prestigious cavalry academy and noble estate dedicated to the breeding of warhorses and the martial education of the aristocracy. Within these renowned institutions, the noble houses of the Hellenic Amazons preserve centuries of equestrian tradition, training generations of mounted warriors in the arts of horsemanship, warfare, and command. From the Hipparcheia emerge the famed Kataphractoi, elite cavalrywomen whose loyalty, discipline, and martial skill form the backbone of the Basilissa's armies."

  thrudarsmedja: "Thrúdarsmedja"
  thrudarsmedja_desc: "At the heart of Thrúdardaler rises Thrúdarsmedja, the Thunder Forge, where the purest iron from Thrúdarfjell is shaped by the finest smiths of the Norse Amazons into weapons of unmatched quality. Within its roaring furnaces, steel is tempered in fire and thunder alike, and it is said that everything forged here, from blades to the mighty Tordenkanoner, carries the strength of the Daughter of Thunder. Those who bear such weapons into battle are believed to wield the wrath of Asgard itself."
  thrudarhavn_artillery_yard_maintenance: "$thrudarsmedja$"

#Temples
 #Hellenic
  temple_of_hera: "Court of Hera"
  temple_of_hera_desc: "The $temple_of_hera$ serves as both a sacred sanctuary and a seat of justice, where magistrates, priestesses and nobles gather beneath the watchful gaze of Hera, Queen of the Skies. Here, laws are proclaimed, oaths are sworn and disputes are settled according to divine custom, reinforcing the authority of the state and the sacred order upon which Amazon society is built."
  temple_of_demeter: "Thesmophorion of Demeter"
  temple_of_demeter_desc: "The $temple_of_demeter$ is a sacred sanctuary dedicated to Demeter, Lady of the Harvest and Giver of Grain. Here, priestesses oversee the cultivation of fertile lands, bless the harvest and safeguard both granaries and seed stores against times of hardship. Serving as a center of agricultural learning, seasonal festivals and the careful stewardship of the earth's bounty, the Thesmophorion ensures that Demeter's gifts sustain the Amazon people through every season."
  temple_of_persephone: "Sanctuary of Persephone"
  temple_of_persephone_desc: "The $temple_of_persephone$ offers refuge to both the living and the dying beneath the gentle gaze of Persephone, Queen of the Underworld. Here, priestesses tend to the sick, comfort the grieving and honor the departed, believing that every soul passes through the Goddess' embrace in its own time. Through careful healing, sacred rites and unwavering compassion, they strive to delay that final journey for as long as fate allows."
  temple_of_aphrodite: "Gardens of Aphrodite"
  temple_of_aphrodite_desc: "The $temple_of_aphrodite$ are sanctuaries of beauty, love and celebration, where fragrant gardens, flowing fountains and blooming orchards are tended in honor of Aphrodite, Goddess of Love. Nestled beside rivers, lakes and sheltered shores, these peaceful retreats host festivals of beauty, marriage celebrations and joyful gatherings that strengthen the bonds of family and community. It is said that wherever the Goddess' gardens flourish, hearts find love, new romances blossom and families grow swiftly."
  temple_of_thalassa: "Beacon of Thalassa"
  temple_of_thalassa_desc: "The $temple_of_thalassa$ rises above the harbor as both lighthouse and sanctuary. Its sacred flame guiding sailors safely through storm and darkness. Dedicated to Thalassa, Primordial Goddess of the Sea, these beacons watch over those who make their living upon the waters, blessing fishermen, pearl divers and mariners alike. It is said that wherever their light shines, the sea is generous, the harbors prosper and every voyage is more likely to find its way safely home."
  temple_of_athena: "Akademia of Athena"
  temple_of_athena_desc: "The $temple_of_athena$ is a center of learning where philosophers, artisans, engineers and strategists pursue knowledge beneath the watchful gaze of Athena, Goddess of Wisdom. Within its halls, the arts and sciences flourish alongside the study of statecraft and warfare, for the Amazons believe that true wisdom is measured not by knowledge alone, but by its application. From these academies, new ideas spread across the realm, shaping a more enlightened and prosperous society."
  temple_of_nike: "Gymnasion of Nike"
  temple_of_nike_desc: "The $temple_of_nike$ is a grand athletic complex dedicated to Nike, Goddess of Victory, where athletes, poets, musicians and craftsmen gather to train, compete and pursue excellence beneath the eyes of the divine. The Amazons believe that greatness is earned through honorable competition, and that every contest, whether of strength, wit or artistry, brings society closer to perfection. These celebrated games draw competitors and spectators from distant lands, spreading Amazon culture far beyond their borders while inspiring new generations to strive for glory."
  temple_of_artemis: "Sacred Grove of Artemis"
  temple_of_artemis_desc: "The $temple_of_artemis$ is no monument of stone and marble, but a living sanctuary where the ancient forest itself is preserved, tended and held sacred. Within these protected groves the Amazons honor Artemis, Goddess of the Wilderness and the Hunt, protecting nature from encroaching civilization while living in harmony with the animals and seasons. Hunters, foresters and wardens thrive beneath the forest canopy while ensuring that nature's bounty remains plentiful and endures for generations to come."
  temple_of_hestia: "Prytaneion of Hestia"
  temple_of_hestia_desc: "The $temple_of_hestia$ is the sacred hearth of every Hellenic Amazon polis, where the eternal flame of Hestia burns as the heart of the community. Around its fire, magistrates, priestesses and citizens gather to celebrate festivals, welcome honored guests and preserve the traditions shared by every Amazon people. From this sacred hearth, warmth, fellowship and prosperity radiate across the surrounding countryside, reminding all that while every polis is unique, they are united as one family beneath Hestia's flame."
  temple_of_enyo: "Tagma of Enyo"
  temple_of_enyo_desc: "The $temple_of_enyo$ stands strong within the heart of Amazon frontier fortifications, where the worship of Enyo, Goddess of War, is inseparable from the defense of the realm. More than a sanctuary, each Tagma serves as an arsenal, training ground and rallying point, ensuring that the fortress is always ready to withstand whatever foe dares threaten the Amazons within it. With the Warrior Priestesses themselves standing shoulder to shoulder with its defenders, neither the walls nor morale shall break easily."
 #Heresy
  temple_of_eris: "Adyton of Eris"
  temple_of_eris_desc: "The $temple_of_eris$ is no place of public worship, but a hidden refuge where outcasts, pirates and heretics gather beneath the shadow of the Fallen One. Here, the teachings of Eris reject law, order and harmony, exalting anarchy as the truest expression of freedom. To the Amazons, these Adyton are nests of sedition and treachery, for wherever the whispers of the Goddess of Chaos take root, trust withers, loyalties fracture and civilization itself begins to unravel."

 #Roman
  temple_of_juno: "Aerarium Junonis"
  temple_of_juno_desc: "The $temple_of_juno$ serves as the financial heart of the Salacian urban centers, where magistrates, quaestors and priestesses safeguard the public treasury beneath the protection of Juno Moneta. Here taxes are collected, revenues accounted for and the wealth of the state carefully administered, for the prosperity of the Republic rests not only upon strong armies, but upon orderly governance and a well-kept treasury."
  temple_of_ceres: "Horreum Cereris"
  temple_of_ceres_desc: "The $temple_of_ceres$ is a sacred granary where the harvest is gathered, stored and safeguarded beneath the watchful eye of Ceres, Goddess of Agriculture and the Bountiful Earth. More than a simple storehouse, these great horrea ensure that cities remain fed through times of scarcity and that the Republic's prosperity endures despite poor harvests. To the Amazons of Salacia, a well-stocked granary is as vital to the strength of the state as any army, for an empty stomach breeds unrest far more swiftly than any foreign enemy."
  temple_of_proserpina: "Mausoleum Proserpinae"
  temple_of_proserpina_desc: "The $temple_of_proserpina$ is a sacred resting place where the honored dead are laid to rest beneath the eternal gaze of Proserpina, Queen of the Underworld. Within these solemn halls, priestesses conduct funeral rites, preserve family lineages and maintain magnificent tombs so that the names and deeds of the departed endure through the ages. To the Amazons of Salacia, death is final but accomplishments live on, for those whose legacy are remembered continue to inspire the living for generations to come."
  temple_of_venus: "Porticus Veneris"
  temple_of_venus_desc: "The $temple_of_venus$ is a magnificent public promenade where art, beauty and civic life flourish beneath the gracious gaze of Venus, Goddess of Love and Prosperity. Lined with elegant colonnades, vibrant gardens and exquisite sculptures, its galleries celebrate the finest works of Amazon artists and craftsmen. Citizens gather here to admire beauty, exchange ideas and take pride in the achievements of the Republic, for the faithful believe that a civilization surrounded by beauty shall itself grow prosperous, harmonious and enduring."
  temple_of_salacia: "Emporium Salaciae"
  temple_of_salacia_desc: "The $temple_of_salacia$ stands at the heart of every great harbor, where merchants, navigators and priestesses gather beneath the watchful gaze of Salacia, Lady of the Seas and patroness of maritime prosperity. Here, cargoes are blessed before departing across distant waters, contracts are signed, and fortunes are made through commerce. To the Salacian Amazons, the sea is not merely a frontier to be crossed, but the lifeblood of the Republic itself, carrying wealth, influence and civilization to every shore touched by its waves."
  temple_of_minerva: "Collegium Minervae"
  temple_of_minerva_desc: "The $temple_of_minerva$ is a prestigious guild where artisans, architects, engineers and magistrates perfect their crafts beneath the guidance of Minerva, Goddess of Wisdom, Crafts and Ingenious Works. Here, knowledge is measured not by endless debate, but by the quality of what it creates. Through disciplined study, practical experience and mastery of the trades, these collegia produce the skilled builders and administrators whose labor strengthens the Republic and enriches its cities."
  temple_of_victoria: "Amphitheatrum Victoriae"
  temple_of_victoria_desc: "The $temple_of_victoria$ stands as a monument to the victories of the Republic, where triumphs are celebrated before cheering crowds through grand spectacles, athletic contests and gladiatorial games. Beneath the watchful gaze of Victoria, tales of conquered enemies and heroic legions inspire new generations to pursue excellence in service of the state. Here, victory is not merely remembered, but transformed into the pride, unity and enduring strength of the Republic."
  temple_of_diana: "Lucus Dianae"
  temple_of_diana_desc: "The $temple_of_diana$ is a sacred woodland preserved beneath the protection of Diana, where nature remains untouched and the bond between the Republic and its countryside is renewed. Farmers, hunters and travelers gather beneath its ancient trees to offer thanks, seek guidance and honor the Goddess who watches over the free people of the land. From these hallowed groves, the spirit of self-reliance, duty and harmony with nature spreads throughout the surrounding countryside."
  temple_of_vesta: "Atrium Vestae"
  temple_of_vesta_desc: "The $temple_of_vesta$ houses the sacred flame of Vesta, guardian of the Amazon household and the keeper of the ancient traditions of the Republic. Within its walls, priestesses preserve the customs, laws and rituals that bind the people together. Through the sacred fire, outsiders are welcomed, transformed and embraced as members of a greater whole, ensuring that the spirit of the Republic survives across generations."
  temple_of_bellona: "Aedes Bellonae"
  temple_of_bellona_desc: "The $temple_of_bellona$ serves as the military and administrative heart of every major Salacian fortress. Here, the priestesses of Bellona oversee the mustering of levies, maintain military records, organize supplies and perform the sacred rites that precede every campaign. While commanders prepare their strategies and messengers carry orders across the Republic, the Aedes ensures that every garrison remains disciplined, well-provisioned and ever ready for war. Through Bellona's guidance, the strength of the Republic lies not only in the courage of its soldiers, but in the order and preparation that sustain them."

 #Norse
  temple_of_frigga: "Great Hall of Frigg"
  temple_of_frigga_desc: "The $temple_of_frigga$ stands at the heart of every loyal province, where the sacred hearth burns day and night beneath the watch of the All-Mother. Here, jarls, priestesses and freewomen gather to swear oaths, settle disputes, welcome travelers and celebrate the bonds of kinship that unite the realm. From its warmth, prosperity and fellowship spread throughout the surrounding countryside, binding distant communities together not through command, but through shared faith and sacred oaths."
  temple_of_sif: "Harvest Hall of Sif"
  temple_of_sif_desc: "The $temple_of_sif$ stands amid golden fields blessed by Sif, the Golden-Haired Lady of the Harvest. Here, grain is gathered, seed stores are protected and the fruits of the land are preserved against the long northern winters. More than a place of worship, the Harvest Hall serves as a communal granary, fairground and feast hall, where priestesses give thanks for the earth's bounty and ensure that no household under Sif's blessing knows hunger."
