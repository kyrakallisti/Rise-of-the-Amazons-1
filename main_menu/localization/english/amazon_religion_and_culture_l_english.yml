l_english:
#Cultures
  amazon_group: "Amazon"
  amazon_group_desc: "The Amazons are an ancient matriarchal civilization descended from the female warriors of Themyskira, who were scattered during the Bronze Age Collapse. Fleeing the turmoil of the Old World, they found refuge in the isolation of the Amazon Islands, where their societies endured and evolved far from the reach of men."

 #Hellenic
  hellenic_amazon_group: "Hellēnikai"
  hellenic_amazon_group_desc: "The Hellēnikai Amazons descended from those who journeyed south after the fall of Themyskira. Traveling through the Aegean and the Mediterranean, they eventually crossed the Atlantic by island-hopping through the Azores aboard their triremes. Over generations, they 'liberated' and assimilated women from the lands of Hellas and beyond, adopting the Greek tongue and reshaping its pantheon in the image of Amazon society."
  old_hellenic_amazon_dialect: "Amazon Greek"
  heraean_amazon: "Hēraiai"
  hestian_amazon: "Hestiaiai"
  aphroditian_amazon: "Aphroditiai"
  thalassan_amazon: "Thalassai"
  athenaean_amazon: "Athēnaiai"
  erisian_amazon: "Erisiai" 
 #Norsellenic
  norsellenic_amazon_dialect: "Norsellenic"
  artemisian_amazon: "Artemisiai"
  norsellenic_amazon: "Norsellēnikai" #Norse-Greek hybrid

 #Norse
  norse_amazon_group: "Norrœnar"
  norse_amazon_group_desc: "The Norrœnar Amazons descended from those who journeyed north after the fall of Themyskira. Passing through the Baltic and the North Sea, they braved the open Atlantic in their longships to reach the Amazon Islands. Along the way, they raided and assimilated women from the Proto-Germanic lands, especially Scandinavia, adopting their tongue and reshaping their traditions and gods to reflect Amazon ideals."
  old_norse_amazon_dialect: "Old Norse"
  friggardaetur_amazon: "Friggardætur" #Daughters of the All-Mother Frigg
  arnarvaengir_amazon: "Arnarvængir" #The Eagle-winged Amazons. Valkyries in all but name
  saebornar_amazon: "Sæbornar" #The Sea-Born Amazons
 #High Norse
  high_norse_amazon_dialect: "High Norse"
  thrudardotre_amazon: "Thrúdardøtre" #Daughters of Thrúd/Thunder
  vindmarkar_amazon: "Vindmarkar" #Amazons from the Wind-Swept Steppes
  freyjardotre_amazon: "Freyjardøtre" #Daughters of Freyja
  
 #Roman Amazons
  roman_amazon_group: "Latinae Amazones"
  roman_amazon_group_desc: "The Latinae Amazons arose from the fusion of Hellenic Amazon traditions with the Latin culture brought by Roman legions during their conquest of the island of Salacia in the 3rd century, then known as Thalassía. Although this marked the furthest reach of Roman expansion into the Atlantic, the island remained under their control for nearly two centuries. When imperial authority waned and the legions prepared to withdraw, the Amazons of Salacia turned upon their conquerors, seizing their fleets, treasuries, and arms. From this decisive rupture emerged a new people, Roman in structure, yet wholly Amazon in spirit. Isolated yet ambitious, they forged a powerful maritime republic governed by wealthy Matrician houses and a Senate of their own. From their island stronghold, they stand as both gatekeepers and conquerors of the Atlantic world."
  salacian_amazon: "Salacianae" #Plural of Salaciana
  bellonian_amazon: "Bellonianae" #Plura of Belloniana
  canarian_amazon: "Canarianae" #Amazons of Canaria (The name comes from actual ancient Rome and means Dog Islands, not from the birds.) 
  latin_amazon_dialect: "Amazon Latin"

#Religions
  amazon_polytheism: "Amazon Polytheism"
  amazon_polytheism_ADJ: "polytheistic"
  amazon_polytheism_desc: "The Amazons have always been a polytheistic society. Different pantheons were born from the contact with other european peoples during the Amazons' long Exodus from the Black Sea to New Themyscira, but up to this day there is a syncretism between all their goddesses and their respective virtues. The All-Mother herself above all."
  
  amazon_hellenism_religion: "Amazon Hellenism"
  amazon_hellenism_religion_ADJ: "Hellenistic"
  amazon_hellenism_religion_desc: "During the Amazon Exodus from the Black Sea in the 12 century B.C., Queen Hippolyta the Wise led her people South and then West, pillaging and sacking her way through the Aegean Sea where she replenished the exhausted numbers of her mighty navy with liberated Greek women. Enough of them to Hellenize the pure Amazons, absorbing their culture, their language and their deities."
  amazon_asatru_religion: "Amazon Ásatrú"

  amazon_asatru_religion_ADJ: "Ásatrúan"
  amazon_asatru_religion_desc: "During the Amazon Exodus from the Black Sea in the 12 century B.C., Princess Penthesilea the Bold rebelled against her sister and took half of the Amazon people North up the River Volga, pillaging and sacking her way through the Baltic Sea where she replenished the exhausted numbers of her mighty navy with liberated proto-germanic women from Scandinavia. Enough of them to Germanize the pure Amazons, absorbing their culture, their language and their deities."

  roman_amazon_religion: "Cultus Dearum Amazonum"
  roman_amazon_religion_ADJ: "Fideles Deis Amazonum"
  roman_amazon_religion_desc: "Known among its followers as Cultus Dearum Amazonum, this faith diverges little in its myths and divine figures from the Amazon Hellenism practiced in the heartlands of Amazonesia. Yet centuries under Roman conquest and assimilation profoundly reshaped the beliefs of the Latinae Amazones. Worship became structured and institutionalized, with strict rites, public ceremonies and religious duties intertwined with the authority of the state. Syncretism with Roman deities was enforced, names were altered and rituals came to emphasize duty and obligation over personal devotion. In time, Bellona and Salacia, the goddesses of war and the sea, rose to prominence. Often surpassing even the All-Mother Juno in the daily worship of Latinae households."

  erisian_heresy: "Eris Heresy"
  erisian_heresy_ADJ: "Erisian"
  erisian_heresy_desc: "Some Amazons just want to watch the world burn in name of the Goddess of Chaos and Mayhem."

# Hellenic Amazon Deities
  hera_amz_god: "Hera"
  hera_amz_god_desc: "$hera_amz_god$, the All-Mother, Queen of Heavens and Creator of the Amazons. Protector of women, children and the sacred bonds that unite society. She embodies lawful authority and righteous rule. To the faithful, her word is absolute and through her divine will all order is maintained."
  worship_hera_amz_god: "$worship_title1$ $hera_amz_god$ as our Patron Deity"
  worship_hera_amz_god_desc: "$worship_desc1$ [ShowGodName('hera_amz_god')] $worship_desc2$"

  athena_amz_god: "Athena"
  athena_amz_god_desc: "$athena_amz_god$, Goddess of Wisdom, Strategy and Crafts, teaches that true strength lies not in brute force, but in knowledge guided by reason. To the Amazons, she is the patron of scholars, inventors, artisans and generals alike, for every great discovery and every brilliant victory begins with a single enlightened mind. Those who seek her favor pray not for easy answers, but for the wisdom to find them."
  worship_athena_amz_god: "$worship_title1$ $athena_amz_god$ as our Patron Deity"
  worship_athena_amz_god_desc: "$worship_desc1$ [ShowGodName('athena_amz_god')] $worship_desc2$"

  nike_amz_god: "Nike"
  nike_amz_god_desc: "$nike_amz_god$, Goddess of Victory and Excellence, teaches that triumph is earned through discipline, perseverance and honor rather than fortune alone. To the Amazons, every contest is an opportunity to surpass oneself, whether upon the battlefield, in the Gymnasion or through feats of strength, speed and skill. Those who seek her favor strive not merely to prevail over others, but to become the finest version of themselves."
  worship_nike_amz_god: "$worship_title1$ $nike_amz_god$ as our Patron Deity"
  worship_nike_amz_god_desc: "$worship_desc1$ [ShowGodName('nike_amz_god')] $worship_desc2$"

  artemis_amz_god: "Artemis"
  artemis_amz_god_desc: "$artemis_amz_god$, Goddess of the Wilderness, the Hunt and the Moon, teaches that mankind is but one part of nature's eternal balance. To the Amazons, the forest is no obstacle to be tamed, but a sacred home to be respected and protected. Those who walk Her path learn patience, self-reliance and harmony with the wild, becoming skilled hunters in peace and fearless defenders of their homeland in times of war."
  worship_artemis_amz_god: "$worship_title1$ $artemis_amz_god$ as our Patron Deity"
  worship_artemis_amz_god_desc: "$worship_desc1$ [ShowGodName('artemis_amz_god')] $worship_desc2$"

  thalassa_amz_god: "Thalassa"
  thalassa_amz_god_desc: "$thalassa_amz_god$, the Primordial Goddess of the Ocean, is the very embodiment of the sea itself. Long before the rise of Olympus, her tides shaped the world and carried the first voyages across the endless horizon. Every Amazon sailor offers a prayer before setting sail, seeking calm waters, favorable winds and a safe return home, for while none can command the sea, all live by Thalassa's mercy."
  worship_thalassa_amz_god: "$worship_title1$ $thalassa_amz_god$ as our Patron Deity"
  worship_thalassa_amz_god_desc: "$worship_desc1$ [ShowGodName('thalassa_amz_god')] $worship_desc2$"

  aphrodite_amz_god: "Aphrodite"
  aphrodite_amz_god_desc: "$aphrodite_amz_god$, Goddess of Love, Beauty, Passion and Desire, teaches that love is life's greatest joy and the surest path to the future. The Amazons celebrate her through festivals, courtship and the free expression of affection, believing that every newborn child is a blessing bestowed by the Goddess herself. It is therefore no surprise that lands devoted to Aphrodite are seldom lacking in laughter... or cradles."
  worship_aphrodite_amz_god: "$worship_title1$ $aphrodite_amz_god$ as our Patron Deity"
  worship_aphrodite_amz_god_desc: "$worship_desc1$ [ShowGodName('aphrodite_amz_god')] $worship_desc2$"

  hestia_amz_god: "Hestia"
  hestia_amz_god_desc: "$hestia_amz_god$, Goddess of the Hearth, Home and Sacred Fire, is revered as the quiet flame that warms Amazon homes, gathers families and preserves the peace of every household. Yet within that gentle fire dwells a far greater power, for the same flame that cooks the meal and lights the hearth also burns beneath the mountains. The Amazons therefore honor Hestia with both gratitude and reverence, knowing that when her sacred fire is neglected or her patience exhausted, it may awaken as an unstoppable and all-consuming inferno."
  worship_hestia_amz_god: "$worship_title1$ $hestia_amz_god$ as our Patron Deity"
  worship_hestia_amz_god_desc: "$worship_desc1$ [ShowGodName('hestia_amz_god')] $worship_desc2$"

  demeter_amz_god: "Demeter"
  demeter_amz_god_desc: "$demeter_amz_god$, Goddess of the Harvest and the Fertile Earth, teaches that civilization is built not by the sword, but by the plow. Every grain gathered, every orchard tended and every field brought to harvest is regarded as a blessing from her generous hand. The Amazons therefore honor Demeter with gratitude and diligence, knowing that while prosperity begins with the harvest, famine follows swiftly wherever her gifts are neglected."
  worship_demeter_amz_god: "$worship_title1$ $demeter_amz_god$ as our Patron Deity"
  worship_demeter_amz_god_desc: "$worship_desc1$ [ShowGodName('demeter_amz_god')] $worship_desc2$"

  persephone_amz_god: "Persephone"
  persephone_amz_god_desc: "$persephone_amz_god$, Queen of the Underworld, is both Goddess of Death and of Life itself. To the Amazons, these are not opposing realms, but two expressions of the same eternal cycle, in which every ending gives rise to a new beginning. Persephone's faithful seek her blessing for healing, long life and protection from disease, believing that when Death's gentle embrace finally comes, it is not an end, but a journey through the Underworld and, in time, into rebirth."
  worship_persephone_amz_god: "$worship_title1$ $persephone_amz_god$ as our Patron Deity"
  worship_persephone_amz_god_desc: "$worship_desc1$ [ShowGodName('persephone_amz_god')] $worship_desc2$"

  enyo_amz_god: "Enyo"
  enyo_amz_god_desc: "$enyo_amz_god$, Goddess of War, Battle and Martial Valor, is the terrible companion of every warrior who marches into battle knowing that victory is never certain. She does not promise safety, only the courage to face death with honor and the resolve to stand firm while others falter. To the Amazons, glory is not found in needless bloodshed, but in fulfilling one's duty, whatever the cost."
  worship_enyo_amz_god: "$worship_title1$ $enyo_amz_god$ as our Patron Deity"
  worship_enyo_amz_god_desc: "$worship_desc1$ [ShowGodName('enyo_amz_god')] $worship_desc2$"

 #Heresy
  eris_amz_god: "Eris"
  eris_amz_god_desc: "$eris_amz_god$, the Fallen One, is the Goddess of Chaos, Discord and Rebellion. She teaches that no throne is truly sacred, no law is completely just and no bond is worthy of blind obedience. To her followers, she is the liberator of the oppressed. But to most Amazons, she is the Great Corrupter, whose whispers dissolve trust, fracture kingdoms and set sister against sister. Her worship is condemned as the gravest of heresies, for wherever Eris is welcomed, civilization itself soon begins to unravel into chaos."
  worship_eris_amz_god: "$worship_title1$ $eris_amz_god$ as our Patron Deity"
  worship_eris_amz_god_desc: "$worship_desc1$ [ShowGodName('eris_amz_god')] $worship_desc2$"

# Norse Amazon Deities
  frigga_god: "Frigg"
  frigga_god_desc: "$frigga_god$, the All-Mother, Queen of Ásgarðr, Lady of Wisdom, Fate and the Hearth. She watches over every hall through her ravens Huginn and Muninn, preserving the oaths, kinship and customs that bind the Amazons together. Though she knows the destiny of all, she speaks only when wisdom demands it, guiding her daughters not through fear, but through foresight, duty and the warmth of a shared hearth."
  worship_frigga_god: "$worship_title1$ $frigga_god$ as our Patron Deity"
  worship_frigga_god_desc: "$worship_desc1$ [ShowGodName('frigga_god')] $worship_desc2$"

  saga_god: "Sága"
  saga_god_desc: "$saga_god$, Goddess of wisdom, memory and storytelling, is the keeper of the Sagas and guardian of the deeds of generations past. Patroness of skalds, poets, historians and scribes, she is believed to inspire all who seek to preserve truth through spoken word and written record alike. Through her blessing, no worthy tale is forgotten, and the memory of great heroes lives on forever."
  worship_saga_god: "$worship_title1$ $saga_god$ as our Patron Deity"
  worship_saga_god_desc: "$worship_desc1$ [ShowGodName('saga_god')] $worship_desc2$"

  thrud_god: "Thrúd"
  thrud_god_desc: "$thrud_god$, the Daughter of Thunder, is the Goddess of strength, valor and military excellence. Daughter of Thor and Sif, she inspires warriors to face every challenge with courage and steadfast resolve. To follow Her is to seek victory through honor, proving one's worth through glorious deeds that shall forever be remembered in the Sagas."
  worship_thrud_god: "$worship_title1$ $thrud_god$ as our Patron Deity"
  worship_thrud_god_desc: "$worship_desc1$ [ShowGodName('thrud_god')] $worship_desc2$"

  skadi_god: "Skaði"
  skadi_god_desc: "$skadi_god$, the Frost Giantess, is the Goddess of winter, mountains, hunting and the untamed wilderness. Fierce, proud and fiercely independent, she teaches that only those who endure nature's harshest trials become truly strong. The colder and more unforgiving the land, the more fervently the Norse Amazons invoke her blessing."
  worship_skadi_god: "$worship_title1$ $skadi_god$ as our Patron Deity"
  worship_skadi_god_desc: "$worship_desc1$ [ShowGodName('skadi_god')] $worship_desc2$"

  ran_god: "Rán"
  ran_god_desc: "$ran_god$, Lady of the Sea, is the Goddess of the tides, waves and the endless ocean. Though her temper can be as fierce as the fiercest storm, she is believed to favor those who sail with humility and respect for the sea. The Amazons honor Rán and her Nine Daughters, who raise every wave upon the ocean, praying for calm waters, abundant catches and a safe return to harbor."
  worship_ran_god: "$worship_title1$ $ran_god$ as our Patron Deity"
  worship_ran_god_desc: "$worship_desc1$ [ShowGodName('ran_god')] $worship_desc2$"

  freyja_god: "Freyja"
  freyja_god_desc: "$freyja_god$, Lady of Seiðr, is the Goddess of love, beauty, magic and noble desire. She teaches that compassion and courage are not opposites, but virtues that strengthen one another. The Amazons honor Freyja as patroness of families, wise women and seiðkonur, believing that those who fall with honor may find eternal rest in her sacred meadows of Fólkvangr."
  worship_freyja_god: "$worship_title1$ $freyja_god$ as our Patron Deity"
  worship_freyja_god_desc: "$worship_desc1$ [ShowGodName('freyja_god')] $worship_desc2$"

  sunna_god: "Sunna"
  sunna_god_desc: "$sunna_god$, Goddess of the Sun, drives her radiant horse-drawn chariot across the heavens each day, bringing light, warmth and life to the world. She is the keeper of the seasons and the herald of every new dawn, whose golden rays nourish the land, guide travelers and remind the faithful that even the longest night must yield to the coming of the Sun."
  worship_sunna_god: "$worship_title1$ $sunna_god$ as our Patron Deity"
  worship_sunna_god_desc: "$worship_desc1$ [ShowGodName('sunna_god')] $worship_desc2$"

  sif_god: "Sif"
  sif_god_desc: "$sif_god$, the Golden-Haired Goddess of the Harvest, Fertility and the Cultivated Earth. Her radiant hair mirrors the endless fields of ripened grain that feed the Amazon people, while her blessing brings abundance, prosperous households and healthy livestock. Through hard work, careful stewardship and the bounty of the land, Sif ensures that no faithful community need fear hunger."
  worship_sif_god: "$worship_title1$ $sif_god$ as our Patron Deity"
  worship_sif_god_desc: "$worship_desc1$ [ShowGodName('sif_god')] $worship_desc2$"

  hel_god: "Hel"
  hel_god_desc: "$hel_god$, Queen of the Underworld, is the Guardian of the Dead and Keeper of the Final Journey. She watches over those whose time has come, receiving every soul with quiet dignity when fate can no longer be delayed. The Amazons pray to Hel not to escape death, but to postpone it until they have lived worthy lives and earned the glory of a noble end."
  worship_hel_god: "$worship_title1$ $hel_god$ as our Patron Deity"
  worship_hel_god_desc: "$worship_desc1$ [ShowGodName('hel_god')] $worship_desc2$"

  idunn_god: "Iðunn"
  idunn_god_desc: "$idunn_god$, Goddess of youth, spring and renewal, is the faithful keeper of the magical golden apples that preserve the eternal youth of the Æsir. Though no mortal may share in the immortality of the gods, the Amazons pray to Iðunn for health, vitality and many long years before old age finally claims them."
  worship_idunn_god: "$worship_title1$ $idunn_god$ as our Patron Deity"
  worship_idunn_god_desc: "$worship_desc1$ [ShowGodName('idunn_god')] $worship_desc2$"

 #Heresy
  loki_god: "Loki"
  loki_god_desc: "$loki_god$, the Shapeshifter, is the mistress of deception, chaos and mischief. Though known to assume countless forms, the Norse Amazons remember Loki as a woman, believing she most often revealed herself to them in feminine guise. Her cunning promises freedom from every chain, yet those who heed her whispers soon discover that every victory comes at an unforeseen price."
  worship_loki_god: "$worship_title1$ $loki_god$ as our Patron Deity"
  worship_loki_god_desc: "$worship_desc1$ [ShowGodName('loki_god')] $worship_desc2$"

# Latin Amazon Deities
  juno_god: "Juno"
  juno_god_desc: "$juno_god$, the All-Mother, Queen of the Heavens and eternal guardian of the Roman Amazons. As patroness of the Republic, She watches over its magistrates, its treasury and its people alike, teaching that no nation can endure without duty, discipline and just governance. Beneath her vigilant gaze, the strength of the state rests not upon a single ruler, but upon the steadfast devotion of every citizen."
  worship_juno_god: "$worship_title1$ $juno_god$ as our Patron Deity"
  worship_juno_god_desc: "$worship_desc1$ [ShowGodName('juno_god')] $worship_desc2$"

  minerva_god: "Minerva"
  minerva_god_desc: "$minerva_god$, Goddess of wisdom, crafts and ingenious works. Patroness of artisans, architects, engineers and magistrates, she teaches that knowledge finds its highest purpose when put to practical use. Under her guidance, workshops flourish, monuments rise and the Republic grows stronger through discipline, skill and tireless industry."
  worship_minerva_god: "$worship_title1$ $minerva_god$ as our Patron Deity"
  worship_minerva_god_desc: "$worship_desc1$ [ShowGodName('minerva_god')] $worship_desc2$"

  victoria_god: "Victoria"
  victoria_god_desc: "$victoria_god$, Goddess of Triumph, Glory and the enduring victories of the Republic. She teaches that true victory is not won upon the battlefield alone, but secured through discipline, sacrifice and cohesion. Every triumph celebrated, every enemy subdued and every province brought into the Republic's embrace stands as a testament to her divine favor."
  worship_victoria_god: "$worship_title1$ $victoria_god$ as our Patron Deity"
  worship_victoria_god_desc: "$worship_desc1$ [ShowGodName('victoria_god')] $worship_desc2$"

  diana_god: "Diana"
  diana_god_desc: "$diana_god$, Goddess of the hunt, the forests and the untamed frontier, watching over the common people, freedwomen and all who dwell beyond the city walls. Beneath the shade of her sacred groves, every free Amazon stands equal, drawing strength from the land and answering the call to arms in times of need."
  worship_diana_god: "$worship_title1$ $diana_god$ as our Patron Deity"
  worship_diana_god_desc: "$worship_desc1$ [ShowGodName('diana_god')] $worship_desc2$"

  salacia_god: "Salacia"
  salacia_god_desc: "$salacia_god$, Lady of the Seas, Patroness of Sailors and guardian of the Roman Amazon Republic. To her faithful, the ocean is not a wild frontier, but the great highway of civilization, carrying commerce, prosperity and the Republic's banners to every distant shore. Every voyage begins with a prayer to Salacia, for through her favor the seas become the lifeblood of the nation."
  worship_salacia_god: "$worship_title1$ $salacia_god$ as our Patron Deity"
  worship_salacia_god_desc: "$worship_desc1$ [ShowGodName('salacia_god')] $worship_desc2$"

  venus_god: "Venus"
  venus_god_desc: "$venus_god$, Goddess of love, beauty, prosperity and the flourishing of civilization. She teaches that affection gives rise to families, families to communities and communities to a strong Republic. Through her blessings, cities grow prosperous, the arts flourish and future generations are born to inherit the legacy of their ancestors."
  worship_venus_god: "$worship_title1$ $venus_god$ as our Patron Deity"
  worship_venus_god_desc: "$worship_desc1$ [ShowGodName('venus_god')] $worship_desc2$"

  vesta_god: "Vesta"
  vesta_god_desc: "$vesta_god$, Goddess of the sacred flame, the household and the eternal traditions of the Republic. She guards the hearths of the Amazon people and preserves the customs, laws and bonds that unite them. To her followers, the flame of Vesta is more than a mere fire. It is the living memory of generations past and the promise that the Amazon civilization shall endure forever."
  worship_vesta_god: "$worship_title1$ $vesta_god$ as our Patron Deity"
  worship_vesta_god_desc: "$worship_desc1$ [ShowGodName('vesta_god')] $worship_desc2$"

  ceres_god: "Ceres"
  ceres_god_desc: "$ceres_god$, Goddess of agriculture, grain and the nourishment of the people. Revered as the patroness of farmers and common folk alike, she ensures that the Republic's granaries remain full and its citizens well fed. To the Amazons of Salacia, no treasure is more precious than bread, for an empty stomach threatens the state more surely than any foreign army."
  worship_ceres_god: "$worship_title1$ $ceres_god$ as our Patron Deity"
  worship_ceres_god_desc: "$worship_desc1$ [ShowGodName('ceres_god')] $worship_desc2$"

  proserpina_god: "Proserpina"
  proserpina_god_desc: "$proserpina_god$, Queen of the Underworld, reigns over the silent realm of the departed and watches faithfully over those who have gone before. To the Amazons of Salacia, death does not erase one's duty to the Republic, for the honored dead endure through memory, lineage and the legacy of their deeds. Her faithful tend tombs, preserve ancestral traditions and perform sacred funeral rites, believing that a civilization which remembers its past shall never lose its future."
  worship_proserpina_god: "$worship_title1$ $proserpina_god$ as our Patron Deity"
  worship_proserpina_god_desc: "$worship_desc1$ [ShowGodName('proserpina_god')] $worship_desc2$"

  bellona_god: "Bellona"
  bellona_god_desc: "$bellona_god$, Goddess of war, discipline and conquest. She presides over the ordered might of the Republic, blessing its legions, commanders and victories alike. Through Bellona, the Amazons believe that triumph belongs not to reckless fury alone, but to unwavering discipline, careful preparation and the strength of an army united beneath a single banner."
  worship_bellona_god: "$worship_title1$ $bellona_god$ as our Patron Deity"
  worship_bellona_god_desc: "$worship_desc1$ [ShowGodName('bellona_god')] $worship_desc2$"

  discordia_amz_god: "Discordia"
  discordia_amz_god_desc: "$discordia_amz_god$, the Fallen One, is the Goddess of Discord, Strife and Sedition. She whispers that no republic is incorruptible, no law beyond question and no ruler deserving of unquestioning loyalty. To her followers, she is the herald of freedom against tyranny. But to the Amazons of Salacia, she is the Great Deceiver, whose words breed suspicion, divide the Senate, shatter alliances and turn citizen against citizen. Her worship is condemned as the gravest of heresies, for wherever Discordia takes root, society itself begins to unravel."
  worship_discordia_amz_god: "$worship_title1$ $discordia_amz_god$ as our Patron Deity"
  worship_discordia_amz_god_desc: "$worship_desc1$ [ShowGodName('discordia_amz_god')] $worship_desc2$"

#Holy Sites
 #Hellenic
  heraion_basileion_holy_city: "The Royal Sanctuary of the All-Mother"
  heraion_basileion_holy_city_desc: "Heraíon Basíleion was founded by the legendary Queen Hippolyta a decade after the arrival of the Hellenic Amazons in these far away shores, and further built upon by each subsequent Queen ever since. The city is a grandiose monument to the All-Mother Hera all on itself, with temples, statues, plazas and even the Royal Palace dedicated to Her name. It is the legitimate seat of power of the Amazon Basilíssai of old, with great symbolic significance for the Amazon kin."
  the_athenaion: "The Athēnaion"
  the_athenaion_desc: "The Great Scholarly Sanctuary of Athena at Glaukōpis, more commonly known as 'The Athēnaion', is a monumental learning complex surrounding the Great Library of Athena, where the greatest archieve of Amazon knowledge, history and arts is accumulated. The sanctuary itself already is rather grandiose, but the sheer intellectual significance of it by far surpasses the grandiosity of any mundane structure."
  agonion_tes_nikephorias: "The Agōnion tēs Nikēphorias"
  agonion_tes_nikephorias_desc: "The Agōnion tēs Nikēphorias is a massive olympic complex where, every 5 years, the best-skilled Amazon athletes gather beneath the gaze of Nike to compete at the Nikēphoria, their sacred Festival of Victory. There, warriors test their strength, speed and skill, for victory is the highest offering to the goddess. Those crowned in laurels as champions earn glory not only among their sisters, but in the eyes of Nike herself."
  sanctuary_of_the_eternal_flame: "The Eternal Fire of Hestia"
  sanctuary_of_the_eternal_flame_desc: "This grand temple faces an active volcano bearing the Goddess' name. All day long, all year around, a large pyre burns hot within it, symbolizing the undying flames of Hestia. A deity revered as the guardian of Amazon homes and families. Yet the same fire that warms and protects may unleash devastation beyond measure. The sacred fire must never falter, so that the heart of the Volcano remain dormant and the blessings of Hestia remain flowing upon Amazonkind."
  thalassa_pharos_island: "The Light of the Sea"
  thalassa_pharos_island_desc: "A towering beacon whose light guides sailors across the waters of Thalassa Bay. Its radiance is a symbol of unity and mastery over the waves, ensuring that no Amazon vessel is ever truly lost thanks to the blessings of Thalassa."
  akra_persephones_necropolis: "The Necropolis at Ákra Persephónēs"
  akra_persephones_necropolis_desc: "The City of the Dead stands at the foot of the Charybdis Mountains, with several districts and temples actually carved into the deep natural caves of the region. It is fabled that there is a direct passage to the Underworld somewhere deep inside those caves, and as such the city is the main site of worship to the goddess Persephone, Queen of the Dead."
  naos_demetras_sacred_gardens: "The Sacred Gardens at Naós Demétras"
  naos_demetras_sacred_gardens_desc: "The black soil of Demetréia is the most fertile land in the Amazon Archipelago. Upon it, a garden bearing the most exuberant crops and trees extends as far as the eyes can see at Naós Demétras. A vast and lush, living green monument to Demeter, Goddess of the Harvest, surrounding a grandiose marble temple complex from where Botanist Priestesses tend to the land, offering blessed seeds and saplings to farmers from far and wide."
  aphrogenia_sacred_beaches: "The Sacred Beaches of Aphrogénia"
  aphrogenia_sacred_beaches_desc: "The breath-taking white sand beaches and crystal clear waters at the shores of Aphrogénia are fabled to be the place where Aphrodite rose from the sea foam to become the Goddess Love, Beauty and Desire. This makes this natural paradise the main tourist destination among the Amazon kin, where married couples come to make or renew their vows and single Amazons come seeking love. That, or seeking endless pleasure in the local festivals and open air orgies by the beach under the gaze of the Lustful Goddess."
  alsos_artemidos_sacred_grove: "The Sacred Grove of Artemis"
  alsos_artemidos_sacred_grove_desc: "The Artemisian Isles have ancient forests covering most of its interior. Many of those places are considered sacred hunting grounds, but the Sacred Grove at Álsos Artemídos is the best preserved wilderness of them all. High in the mountains, it's isolated from civilization and difficult to access. Only the most devoted priestesses of Artemis and the best Amazon Huntresses are allowed into the grove, but its fabled natural beauty has become legendary nonetheless."
  agoge_enyous: "Agōgē Enýous"
  agoge_enyous_desc: "No cheers echo within these stone grounds, only the rhythm of marching feet, clashing bronze, and disciplined breath. Here, daughters of the Hellenic Amazons are forged through hardship, endurance, and unrelenting martial discipline beneath the gaze of Enyo. Strength alone is not enough. Only those who master fear, pain and the self are deemed worthy to lead both shield and sister into battle."
 #Herectic
  kepos_eridos: "Kēpos Erídos"
  kepos_eridos_desc: "Amid the wreck-strewn waters and the ruins of a sunken temple lies the Orchard of Discord, where golden fruit grows beneath the shadow of Eris. Here, the Pirate Queen—the Kallistē—is chosen not by strength or lineage, but by chance alone: names cast into a vessel, and a parrot's beak drawing fate at random. In Kallistí, anarchy is sacred, and the fairest is whoever chaos wills."

 #Norse
  eldara_ancestral_city: "Fornmæðraeldr"
  eldara_ancestral_city_desc: "The Hearth of the Foremothers, known as the City of Eldára, stands as the eternal heart of the Norrœnar Amazons, where the memory of the foremothers is carved in stone and carried in blood. Great halls and solemn monuments rise in honor of those who came before, their names recited beside ever-burning hearths that bind past and present. There, lineage is sacred. Every daughter walks in the footsteps of those who forged the path before her. In Eldára, Frigg is revered as the keeper of ancestry, the guardian of mothers, and the thread that weaves all generations into one."
  sessrumnir_and_folkvangr: "Fólkvangr"
  sessrumnir_and_folkvangr_desc: "In the blooming fields of Fólkvangr stands Sessrúmnir, the hall of Freyja, where the chosen are welcomed with honor and desire. Here, the fallen are not mourned but celebrated, for it is said that Freyja herself walks among them, claiming those she favors. Warriors, lovers and sisters-in-arms alike gather in her name, where bonds are forged in passion as much as in battle. In this sacred place, love is strength, death is not an end, and to be chosen by Freya is the greatest honor of all."
  holy_site_thrudarfjell: "Thrúdarfjell"
  holy_site_thrudarfjell_desc: "The towering peak of Thrúdarfjell has been sacred to the Thrúdardøtre since times immemorial. Rich in iron and crowned by dark storm clouds, the mountain is renowned for the lightning that so often strikes its summit, a spectacle the faithful believe to be the Daughter of Thunder revealing her divine presence. Pilgrims journey from across Nordheimar to offer sacrifices upon its windswept slopes, praying for strength, courage and steadfast resolve. To the Norse Amazons, Thrúdarfjell is more than a mountain. It is the enduring symbol of Thrúd's power and the unbreakable spirit of those who dwell beneath its shadow."
  ranarnet: "Ránarnet"
  ranarnet_desc: "At the edge of the northern seas lies Ránvík, where the waters teem with life beyond reason and storms rise without warning. The Norse Amazons believe these bountiful fisheries are the casting of Rán's Great Net, gathering both riches and the unwary. Offerings are cast into the depths before every voyage, for while the sea may be generous, it never gives without claiming its due."
  sagavindhall: "Ságavind's Hall of Sagas"
  sagavindhall_desc: "Carved not by hand but by wind and time, Ságahall rests within the cliffs of Ságavind, where the sea breathes into stone. There the voices of the Vindmarkar Amazons gather, not to write their history, but to speak it. The wind carries every tale, every oath, every name across the hollowed rock, as if the land itself listens. It is said that those whose deeds are worthy are remembered by the wind itself, while those who are not are lost to silence."
  idunnarlundr: "Iðunnarlundr"
  idunnarlundr_desc: "A sacred grove of exquisite beauty, where careful tending and wild nature exist in perfect harmony. Nestled amid gentle rolling hills and clear waters, its orchards are famed for bearing the sweetest apples in the world. Their fragrance said to linger on the breeze long before the trees come into view. Dedicated to Iðunn, the grove is a place of quiet reverence, where Amazons walk beneath flowering branches and partake in its bounty. It is whispered that those who taste its finest fruit feel a fleeting renewal within them as if, for a moment, they share in the timeless youth once granted to the gods."
  solleid: "Sólleið"
  solleid_desc: "High upon Sunnasfjall lies Sólleið, where the path of the sun is traced across stone and sky. Great pillars and ancient markers stand in silent alignment with the heavens, catching the light of dawn and dusk at sacred times of the year. Here, the Amazons follow the course of Sunna, witnessing the turning of seasons and the steady passage of fate. In this place, time flows as surely as the sun moves above, and all who stand beneath its light are bound to the eternal rhythm of her journey."
  sifvangr: "Sifvangr"
  sifvangr_desc: "In the fertile lands of Tvillingsøstre lies Sifvangr, where the earth itself is sacred. The red soil of the valley yields golden grain in abundance, nourished by the steady waters of the river and the careful hands of those who tend it. No towering temple marks this place, for Sif is honored not in stone, but in the living fields. Here, the cycles of sowing and harvest are rites in themselves, and the first fruits of every season are given in quiet devotion. It is said that the golden waves of wheat are the reflection of the goddess herself, and that as long as the fields endure, so too does her blessing upon the land and its people."
  helgrind: "Helgrind"
  helgrind_desc: "On the quiet black cliffs overlooking the dark forests of Myrklund stands Helgrind, the threshold from which none return. There are no songs sung here, no victories remembered. Only an immense and unnaturally silent rock formation, and the certainty of what awaits all who do not earn a place among the honored dead. The land is still, the air unmoving, as if the world itself holds its breath. It is a place not of fear, but of truth. Every life that flourishes beneath the sun must one day pass beyond this silent gate. No blade, no glory, and no defiance can ward off its call forever."
  thrymheimr_silver: "Sølvbein"
  thrymheimr_silver_desc: "High upon Þrymheimr, where the peaks of Jötnalfjall pierce the sky, lies the deep mines of Sølvbein. The mountain is said to hold the bones of giants within it, its veins rich with shining metal drawn from the deep earth. Here, Skadi is honored as the Lady of Winter and Stone, the one who walks where no life endures. The Amazons who dwell in these heights carve silver from the frozen rock, believing it to be touched by the ancient powers of the Jötnar. In this place of cold and silence, strength is not proven by conquest, but by endurance, and those who endure are said to stand closest to the goddess herself."
  veidihjarta: "Veiðihjarta"
  veidihjarta_desc: "There is no temples at Veiðihjarta. Only the hunt. Set upon the wild heights of Arnarhjarta, this sacred hunting grounds are where Skadi is worshiped not through prayer, but through action! Here, the wind cuts like blades, the cliffs demand sure footing, and the prey is never weak. Those who come seeking favor must prove themselves, for the Goddess does not listen to words, only to feats of bravery and demonstrations of skill. Arrows loosed in hesitation miss their mark; blades wielded without conviction falter. At Veiðihjarta, every step is watched, every strike weighed. To hunt is to be judged. To prevail is to be worthy. And to fail… is to be forgotten."
  lifandi_eldr: "Lifandi Eldr"
  lifandi_eldr_desc: "The Almóðurhof is grand temple praising Frig not with runes carved in stone, but with timber, hearth and living memory. There burns a sacred flame carried all the way from Eldára, tended by the first mothers of the colony. It is a place where families are forged, daughters are raised and new lineages take root. In this humble hall, Frigg is honored not through monuments, but through the quiet endurance of life itself."

 #Latin
  holy_site_salacia: "Ostium Salaciae"
  holy_site_salacia_desc: "Long before the first quays were laid or the great harbor was carved from the coast, the tranquil waters of this sheltered bay were revered as sacred to Salacia, the Amazon Goddess of the Sea. Pilgrims gathered here to pray for calm seas, favorable winds and safe voyages, while generations of priestesses tended the many shrines that lined its shores. As Salacia Augusta grew into one of the greatest maritime powers of Amazonesia, this ancient sanctuary remained at the heart of the city's busy harbour, reminding all who behold it that dominion over the seas begins with reverence for the goddess who rules them."
  arena_bellonae: "Arena Bellonae"
  arena_bellonae_desc: "A vast arena where bronze sings and blood answers. Here, warriors prove themselves before Bellona not in idle sport, but in sacred violence. Through trial by combat, the worthy are revealed, hardened, and raised to command within the mighty Salacian Legions! Their strength and resolve proven in the only language Bellona respects. Victors rise in glory, while the defeated fall in shame."
  ignis_aeternus_vestae: "Ignis Aeternus Vestae"
  ignis_aeternus_vestae_desc: "At the narrow pass of Fauces Vestae burns the eternal flame of the goddess, guarded restlessly by her chosen keepers. So long as it endures, the heart of Salacia endures with it. Here, vigilance is devotion, and the safety of the state is sacred duty."

  #Latin Holy Sites in Old World
  aedes_junonis_monetae: "Aedes Junonis Monetae"
  aedes_junonis_monetae_desc: "Once the sacred seat of Juno Moneta and the beating heart of Roman sovereignty, this great temple stood on the Capitoline Hill as the ultimate symbol of Rome's rightful dominion. Here, coinage, law and authority were sanctified beneath the watchful gaze of the Queen of Heaven. To claim it is not merely to conquer Rome, but to inherit its eternal mandate."
  horrea_cereris: "Horrea Cereris"
  horrea_cereris_desc: "Great granaries and fertile storehouses rise beneath the blessing of Ceres, nourisher of civilization and guardian of abundance. From these lands flowed the grain that once fed the Roman world itself. Whoever commands the bounty of Africa commands the lifeblood of empires."
  promontorium_minervae: "Promontorium Minervae"
  promontorium_minervae_desc: "The windswept cape of $promontorium_minervae$ marks the westernmost edge of the old world. Long before the rise of Rome, before even the founding of Amazonesia, it was here that the ancestors of the Amazons stood upon the cliffs and gazed into the endless Ocean. While others saw only the end of the world, Minerva revealed the promise of what lay beyond. Trusting not in fortune, but in faith, courage and careful preparation, they embarked upon the voyage that would one day lead them to Amazonesia. Though the world has forgotten that first crossing, the Salacianae still remember this sacred shore as the place where Wisdom overcame Fear."
  litus_veneris: "Litus Veneris"
  litus_veneris_desc: "Along the radiant shores of Aphrogenia, where the sea is said to have first revealed the Goddess in ages long past, the followers of Venus embrace one of their holiest sanctuaries. Pilgrims, artists and lovers journey from across the seas to seek her blessing, believing that beauty, prosperity and harmony flow endlessly from these sacred waters."
  victoria_aeterna: "Victoria Aeterna"
  victoria_aeterna_desc: "The Eternal Victory stands as the supreme symbol of imperial triumph. Empires may rise and collapse around its walls, yet the dream of dominion endures unbroken. To seize back the mother of all cities within rightful Roman hands is to proclaim before the world that Rome still lives through the Latin Amazons!"
  lucus_proserpinae: "Lucus Proserpinae"
  lucus_proserpinae_desc: "Hidden among the highlands of Sicily lies the sacred grove of Proserpina, where ancient myths speak of the Maiden's descent into the underworld. Quiet and solemn beneath whispering trees, this place reminds all mortals that life, death and rebirth remain forever entwined."
  lucus_dianae: "Lucus Dianae"
  lucus_dianae_desc: "Deep within the wild mountains of western Iberia rests a sacred grove devoted to Diana, Huntress of the Moon and guardian of untamed lands. Here, among ancient forests and mist-covered peaks, the faithful seek strength, discipline and freedom beneath the watchful eyes of the Goddess."