  crown_estate_hellenic_amazon_theocracy: "Hierón" #The Sacred / The Holy Domain

  nobles_estate_hellenic_amazon: "Eugenê" #The Well-Born / The Noble-Born
  clergy_estate_hellenic_amazon: "Hierateía" #The Clergy / The Priesthood
  burghers_estate_hellenic_amazon: "Astoí" #The Townsfolk / Citizens
  peasants_estate_hellenic_amazon: "Ágroikoi" #Rural Folk
  tribes_estate_hellenic_amazon: "Bárbaroi"

#Norse Amazon
  crown_estate_norse_amazon_monarchy: "Konungdómr" #Kingship / Royal Authority
  crown_estate_norse_amazon_republic: "Lögþing" #Law Assembly
